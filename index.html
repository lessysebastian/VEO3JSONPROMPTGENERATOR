<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEO3 JSON PROMPT GENERATOR by Lessy Sebastian</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .input-style {
            width: 100%;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 1.15rem;
            padding: 0.85rem 1.15rem;
            color: #f1f5f9;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-style:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 5px rgba(99, 102, 241, 0.1);
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Komponen Icon Sederhana (Menggunakan SVG Inline untuk reliabilitas di HTML tunggal)
        const Icon = ({ name, size = 18, className = "" }) => {
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const NavItem = ({ icon, label, active, onClick }) => (
            <button 
                onClick={onClick}
                className={`flex items-center gap-4 w-full px-5 py-4 rounded-2xl transition-all duration-300 group relative overflow-hidden ${
                    active 
                    ? 'bg-indigo-600 text-white shadow-2xl shadow-indigo-600/30' 
                    : 'text-slate-500 hover:bg-slate-800 hover:text-slate-200'
                }`}
            >
                <Icon name={icon} size={18} className={active ? 'text-white' : 'text-slate-600 group-hover:text-indigo-400'} />
                <span className={`text-xs font-black tracking-wide uppercase ${active ? 'opacity-100' : 'opacity-70 group-hover:opacity-100'}`}>{label}</span>
                {active && <div className="absolute right-4"><Icon name="chevron-right" size={12} className="opacity-50" /></div>}
            </button>
        );

        const CustomSelect = ({ label, value, customValue, options, onChange, onCustomChange }) => {
            const isCustom = value === 'Custom';
            return (
                <div className="flex flex-col gap-2 w-full text-left">
                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">{label}</label>
                    <div className="relative">
                        <select 
                            value={value} 
                            onChange={(e) => onChange(e.target.value)} 
                            className={`input-style appearance-none cursor-pointer ${isCustom ? 'border-indigo-500/50' : ''}`}
                        >
                            {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                        </select>
                        <div className="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                            <Icon name="plus" size={14} />
                        </div>
                    </div>
                    {isCustom && (
                        <div className="mt-1 animate-in fade-in slide-in-from-top-1 duration-200">
                            <div className="relative">
                                <div className="absolute left-3 top-1/2 -translate-y-1/2 text-indigo-400"><Icon name="edit-3" size={14} /></div>
                                <input 
                                    type="text" 
                                    placeholder={`Tulis ${label} manual...`} 
                                    className="input-style pl-10 border-indigo-500/40 bg-indigo-500/5 ring-1 ring-indigo-500/20"
                                    value={customValue || ''}
                                    onChange={(e) => onCustomChange(e.target.value)}
                                    autoFocus
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [isAuthorized, setIsAuthorized] = useState(false);
            const [accessCodeInput, setAccessCodeInput] = useState('');
            const [authError, setAuthError] = useState(false);
            const [copied, setCopied] = useState(false);
            const REQUIRED_CODE = "JSONVEO3BYLESSY";

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const createNewSubject = () => ({
                id: Math.random().toString(36).substr(2, 9),
                type: 'Human',
                type_custom: '',
                description: '',
                action: 'Standing',
                action_custom: '',
                dialog: {
                    enabled: false,
                    text: '',
                    language: 'English',
                    language_custom: '',
                    accent: 'Neutral',
                    accent_custom: ''
                }
            });

            const initialState = {
                aspect_ratio: '16:9 (YouTube/Desktop)',
                aspect_ratio_custom: '',
                video_duration: '10s',
                video_duration_custom: '',
                subjects: [createNewSubject()],
                environment: {
                    location: 'Indoor',
                    location_custom: '',
                    time: 'Golden Hour',
                    time_custom: '',
                    weather: 'Clear',
                    weather_custom: '',
                    atmosphere: ''
                },
                audio: {
                    music_enabled: false,
                    genre: 'Cinematic',
                    genre_custom: '',
                    mood: 'Epic',
                    mood_custom: '',
                    volume: 75
                },
                camera: {
                    angle: 'Eye Level',
                    angle_custom: '',
                    movement: 'Static',
                    movement_custom: '',
                    lens: '35mm Wide Angle'
                },
                style: {
                    aesthetic: 'Photorealistic',
                    aesthetic_custom: '',
                    color_grading: 'Natural',
                    lighting: 'Soft Studio Lighting',
                    lighting_custom: ''
                },
                motion: {
                    dynamic_range: 'Medium',
                    flow: 'Continuous'
                }
            };

            const [promptData, setPromptData] = useState(initialState);
            const [activeTab, setActiveTab] = useState('general');

            const options = {
                subject: {
                    types: ['Human', 'Animal', 'Object', 'Abstract', 'Vehicle', 'Custom'],
                    actions: ['Standing', 'Walking', 'Running', 'Talking', 'Dancing', 'Gesturing', 'Custom'],
                    languages: ['Indonesian', 'English', 'Japanese', 'Korean', 'French', 'German', 'Spanish', 'Custom'],
                    accents: ['Neutral', 'British', 'American', 'Jakarta/Slang', 'Formal', 'Whispering', 'Custom']
                },
                general: {
                    aspect_ratios: ['16:9 (YouTube/Desktop)', '9:16 (TikTok/Reels/Shorts)', '1:1 (Instagram Square)', 'Custom'],
                    durations: ['5s', '10s', '15s', '30s', '60s', 'Custom']
                },
                audio: {
                    genres: ['Cinematic', 'Ambient', 'Electronic', 'Lo-fi', 'Acoustic', 'Orchestral', 'Custom'],
                    moods: ['Happy', 'Suspenseful', 'Dark', 'Calm', 'Epic', 'Melancholic', 'Custom']
                },
                environment: {
                    locations: ['Forest', 'Cyberpunk City', 'Desert', 'Ocean', 'Studio', 'Modern Office', 'Space Station', 'Custom'],
                    times: ['Daylight', 'Golden Hour', 'Blue Hour', 'Midnight', 'Sunrise', 'Custom'],
                    weather: ['Clear', 'Rainy', 'Foggy', 'Snowy', 'Stormy', 'Heatwave', 'Custom']
                },
                camera: {
                    angles: ['Eye Level', 'Low Angle', 'High Angle', 'Drone View', 'Close-up', 'Custom'],
                    movements: ['Static', 'Pan Left/Right', 'Tilt Up/Down', 'Dolly Zoom', 'Tracking', 'Custom']
                },
                style: {
                    aesthetics: ['Photorealistic', 'Anime Style', 'Oil Painting', '3D Render', 'Noir', 'Custom'],
                    lighting: ['Soft Studio', 'Hard Sunlight', 'Neon/RGB', 'Volumetric', 'Candlelight', 'Custom']
                }
            };

            const handleAuth = (e) => {
                e.preventDefault();
                if (accessCodeInput === REQUIRED_CODE) {
                    setIsAuthorized(true);
                } else {
                    setAuthError(true);
                }
            };

            const updateField = (category, field, value) => {
                if (category === null) {
                    setPromptData(prev => ({ ...prev, [field]: value }));
                } else {
                    setPromptData(prev => ({
                        ...prev,
                        [category]: { ...prev[category], [field]: value }
                    }));
                }
            };

            const cleanValue = (val) => {
                if (typeof val !== 'string') return val;
                return val.split(' (')[0].trim();
            };

            const getCleanJson = () => {
                return JSON.stringify(promptData, (key, value) => {
                    if (key === 'id') return undefined;
                    if (['aspect_ratio', 'video_duration', 'genre', 'mood', 'language', 'accent'].includes(key)) return cleanValue(value);
                    return value;
                }, 2);
            };

            const copyToClipboard = () => {
                const jsonString = getCleanJson();
                const textArea = document.createElement("textarea");
                textArea.value = jsonString;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            if (!isAuthorized) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4">
                        <div className="max-w-md w-full">
                            <div className="bg-slate-900 border border-slate-800 p-8 rounded-[2.5rem] shadow-2xl text-center">
                                <div className="bg-gradient-to-br from-indigo-500 to-purple-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6"><Icon name="lock" size={32} className="text-white"/></div>
                                <h1 className="text-xl font-black tracking-tighter text-white mb-2">VEO3 JSON PROMPT GENERATOR</h1>
                                <p className="text-xs text-indigo-400 font-bold uppercase tracking-widest mb-8">by Lessy Sebastian</p>
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <input 
                                        type="password" 
                                        placeholder="Masukkan Kode Akses..." 
                                        className={`input-style text-center tracking-widest font-bold ${authError ? 'border-red-500' : ''}`}
                                        value={accessCodeInput}
                                        onChange={(e) => {setAccessCodeInput(e.target.value); setAuthError(false);}}
                                    />
                                    {authError && <p className="text-[10px] text-red-400 font-bold uppercase">Kode salah.</p>}
                                    <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 rounded-2xl transition-all shadow-xl active:scale-95 flex items-center justify-center gap-2">
                                        <Icon name="unlock" size={18}/> BUKA APLIKASI
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row">
                    <nav className="w-full md:w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col gap-2 shrink-0">
                        <div className="flex items-center gap-3 mb-8 px-2">
                            <div className="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-600/20"><Icon name="video" size={24} className="text-white"/></div>
                            <div>
                                <h1 className="text-sm font-black tracking-tighter leading-tight uppercase">VEO3 JSON PROMPT<br/>GENERATOR</h1>
                                <p className="text-[9px] text-indigo-400 font-bold uppercase tracking-widest mt-1">by Lessy Sebastian</p>
                            </div>
                        </div>
                        <NavItem icon="monitor" label="Video & Format" active={activeTab === 'general'} onClick={() => setActiveTab('general')} />
                        <NavItem icon="user" label="Subjek & Karakter" active={activeTab === 'subject'} onClick={() => setActiveTab('subject')} />
                        <NavItem icon="music" label="Musik & Audio" active={activeTab === 'audio'} onClick={() => setActiveTab('audio')} />
                        <NavItem icon="map" label="Lingkungan" active={activeTab === 'environment'} onClick={() => setActiveTab('environment')} />
                        <NavItem icon="settings" label="Kamera" active={activeTab === 'camera'} onClick={() => setActiveTab('camera')} />
                        <NavItem icon="palette" label="Gaya Visual" active={activeTab === 'style'} onClick={() => setActiveTab('style')} />
                        <NavItem icon="activity" label="Gerakan" active={activeTab === 'motion'} onClick={() => setActiveTab('motion')} />
                        <div className="mt-auto pt-6 border-t border-slate-800 text-[10px] text-slate-500 uppercase font-bold text-center">Authorized Access</div>
                    </nav>

                    <main className="flex-1 p-4 md:p-8 overflow-y-auto bg-slate-950">
                        <div className="max-w-4xl mx-auto">
                            <header className="mb-8 flex justify-between items-center">
                                <div>
                                    <h2 className="text-3xl font-black mb-1 capitalize tracking-tight">{activeTab === 'general' ? 'Video Format' : activeTab}</h2>
                                    <p className="text-slate-400 text-sm">Panel Konfigurasi VEO 3.</p>
                                </div>
                                {activeTab === 'subject' && (
                                    <button onClick={() => setPromptData(p => ({...p, subjects: [...p.subjects, createNewSubject()]}))} className="bg-indigo-600 text-white px-5 py-2.5 rounded-2xl text-sm font-black flex items-center gap-2"><Icon name="user-plus" size={18}/> Tambah</button>
                                )}
                            </header>

                            <div className="space-y-6">
                                {activeTab === 'general' && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-[2.5rem] p-8 shadow-xl grid grid-cols-1 md:grid-cols-2 gap-8 animate-in fade-in duration-500">
                                        <CustomSelect label="Aspek Rasio" value={promptData.aspect_ratio} customValue={promptData.aspect_ratio_custom} options={options.general.aspect_ratios} onChange={(v) => updateField(null, 'aspect_ratio', v)} onCustomChange={(v) => updateField(null, 'aspect_ratio_custom', v)} />
                                        <CustomSelect label="Durasi" value={promptData.video_duration} customValue={promptData.video_duration_custom} options={options.general.durations} onChange={(v) => updateField(null, 'video_duration', v)} onCustomChange={(v) => updateField(null, 'video_duration_custom', v)} />
                                    </div>
                                )}

                                {activeTab === 'subject' && promptData.subjects.map((sub, index) => (
                                    <div key={sub.id} className="bg-slate-900 border border-slate-800 rounded-[2.5rem] p-8 relative animate-in slide-in-from-bottom-4 duration-500 mb-6">
                                        {promptData.subjects.length > 1 && (
                                            <button onClick={() => setPromptData(p => ({...p, subjects: p.subjects.filter(s => s.id !== sub.id)}))} className="absolute top-6 right-6 bg-red-500/10 text-red-500 p-2 rounded-full"><Icon name="x" size={18}/></button>
                                        )}
                                        <div className="flex items-center gap-4 mb-8 border-b border-slate-800 pb-6">
                                            <div className="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-sm font-black text-white shadow-lg shadow-indigo-600/20">#{index+1}</div>
                                            <h3 className="font-black text-slate-100 uppercase text-lg">Subjek Karakter</h3>
                                        </div>
                                        <div className="space-y-8">
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                <CustomSelect label="Tipe" value={sub.type} customValue={sub.type_custom} options={options.subject.types} onChange={(v) => setPromptData(p => ({...p, subjects: p.subjects.map(s => s.id === sub.id ? {...s, type: v} : s)}))} onCustomChange={(v) => setPromptData(p => ({...p, subjects: p.subjects.map(s => s.id === sub.id ? {...s, type_custom: v} : s)}))} />
                                                <CustomSelect label="Aksi" value={sub.action} customValue={sub.action_custom} options={options.subject.actions} onChange={(v) => setPromptData(p => ({...p, subjects: p.subjects.map(s => s.id === sub.id ? {...s, action: v} : s)}))} onCustomChange={(v) => setPromptData(p => ({...p, subjects: p.subjects.map(s => s.id === sub.id ? {...s, action_custom: v} : s)}))} />
                                            </div>
                                            <textarea className="input-style min-h-[100px]" placeholder="Deskripsi detail fisik..." value={sub.description} onChange={(e) => setPromptData(p => ({...p, subjects: p.subjects.map(s => s.id === sub.id ? {...s, description: e.target.value} : s)}))} />
                                        </div>
                                    </div>
                                ))}

                                {activeTab === 'audio' && (
                                    <div className="bg-slate-900 border border-slate-800 rounded-[2.5rem] p-8 animate-in fade-in duration-500">
                                        <div className="flex justify-between items-center mb-8">
                                            <div className="flex items-center gap-3"><Icon name="music" className="text-indigo-400" size={24}/><div><h3 className="font-black uppercase">Background Music</h3></div></div>
                                            <input type="checkbox" checked={promptData.audio.music_enabled} onChange={(e) => updateField('audio', 'music_enabled', e.target.checked)} className="w-6 h-6 rounded cursor-pointer" />
                                        </div>
                                        {promptData.audio.music_enabled && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                                <CustomSelect label="Genre" value={promptData.audio.genre} customValue={promptData.audio.genre_custom} options={options.audio.genres} onChange={(v) => updateField('audio', 'genre', v)} onCustomChange={(v) => updateField('audio', 'genre_custom', v)} />
                                                <CustomSelect label="Mood" value={promptData.audio.mood} customValue={promptData.audio.mood_custom} options={options.audio.moods} onChange={(v) => updateField('audio', 'mood', v)} onCustomChange={(v) => updateField('audio', 'mood_custom', v)} />
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <aside className="w-full md:w-[450px] bg-slate-900 border-l border-slate-800 p-8 flex flex-col h-screen md:sticky md:top-0">
                        <div className="flex flex-col gap-6 mb-8">
                            <div className="flex items-center gap-3 text-indigo-400"><Icon name="code" size={20} /><span className="font-black text-xs uppercase tracking-widest">JSON Output Preview</span></div>
                            <div className="flex gap-2">
                                <button onClick={copyToClipboard} className={`flex-1 py-3.5 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all ${copied ? 'bg-emerald-500 text-white' : 'bg-indigo-600 text-white'}`}>
                                    {copied ? 'Copied' : 'Copy JSON'}
                                </button>
                                <button onClick={() => window.location.reload()} className="px-5 bg-slate-800 text-slate-400 border border-slate-700 rounded-2xl"><Icon name="rotate-ccw" size={18}/></button>
                            </div>
                        </div>
                        <div className="flex-1 bg-black/50 rounded-[2rem] p-6 overflow-hidden border border-slate-800 flex flex-col">
                            <pre className="text-[10px] font-mono text-indigo-300 leading-relaxed overflow-y-auto flex-1 custom-scrollbar">{getCleanJson()}</pre>
                        </div>
                        <div className="mt-8 p-6 bg-slate-950 border border-slate-800 rounded-[2rem] text-center"><p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest">Designed by Lessy Sebastian</p></div>
                    </aside>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
